<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101713">
  <title>SARWARI EXCHANGE</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="brand-header">
      <div class="brand-mark" aria-hidden="true">S</div>
      <div>
        <p class="eyebrow">SARWARI EXCHANGE</p>
        <h1>صرافی و خدمات پولی سروری</h1>
        <p class="welcome">✨ اعتماد • شفافیت • سرعت</p>
      </div>
      <span class="status-dot" title="آنلاین"></span>
    </header>

    <section class="menu-grid" aria-label="منوی اصلی">
      <button class="glass-button" data-action="buy_sell"><span>💱</span><strong>خرید و فروش ارز</strong></button>
      <button class="glass-button" data-action="remittance"><span>🌍</span><strong>حواله و انتقال پول</strong></button>
      <button class="glass-button" data-action="rates"><span>📊</span><strong>نرخ اسعار</strong></button>
      <button class="glass-button" data-action="gold"><span>🥇</span><strong>نرخ طلا</strong></button>
      <button class="glass-button" data-action="account"><span>👤</span><strong>حساب من</strong></button>
      <button class="glass-button" data-action="transactions"><span>🧾</span><strong>معاملات من</strong></button>
      <button class="glass-button" data-action="about"><span>ℹ️</span><strong>درباره صرافی</strong></button>
      <button class="glass-button" data-action="support"><span>🆘</span><strong>پشتیبانی</strong></button>
    </section>

    <footer class="secure-note"><span>🔐</span> اطلاعات شما محرمانه است</footer>
    <p class="toast" role="status" aria-live="polite"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
